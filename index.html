<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Érettségi tárgyak – képzéskereső</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#1a2340;--mute:#5a6480;--line:#d5dbe8;--accent:#e9a800;--accent-ink:#1a2340;--ok:#14705f;--okbg:#dff2ec;--chip:#e6eaf3;
--hd:"Bricolage Grotesque","Trebuchet MS",sans-serif;--bd:"Public Sans","Segoe UI",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--panel:#182038;--ink:#eaeefb;--mute:#9ba6c7;--line:#2c3656;--accent:#f2b92e;--accent-ink:#141a30;--ok:#5fd1b6;--okbg:#14382f;--chip:#242e4c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1426;--panel:#182038;--ink:#eaeefb;--mute:#9ba6c7;--line:#2c3656;--accent:#f2b92e;--accent-ink:#141a30;--ok:#5fd1b6;--okbg:#14382f;--chip:#242e4c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--bd)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
h1{font:700 clamp(30px,5vw,48px)/1.05 var(--hd);margin:0 0 8px;letter-spacing:-.02em}
.lead{color:var(--mute);margin:0 0 26px;max-width:62ch}
.grid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
@media(max-width:860px){.side{position:static}}
.slot{border:2px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:12px;transition:border-color .15s,background .15s}
.slot.on{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.slot label.t{display:block;font:600 14px var(--bd);margin-bottom:6px}
select,input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.emelt{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--mute)}
.emelt input{accent-color:var(--accent);width:18px;height:18px}
fieldset{border:0;padding:0;margin:14px 0}
legend{font:600 14px var(--bd);padding:0;margin-bottom:6px}
.radio{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}
.radio input{accent-color:var(--accent);margin-top:4px}
.radio small{display:block;color:var(--mute)}
.f{margin-top:12px}.f>span{display:block;font:600 14px var(--bd);margin-bottom:4px}
button{font:600 15px var(--bd);cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.count{font:700 28px var(--hd)}.count small{font:400 15px var(--bd);color:var(--mute)}
.hint{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card h2{font:700 18px/1.25 var(--hd);margin:0 0 2px}
.inst{color:var(--mute);font-size:14px;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px}
.chip.e{background:var(--accent);color:var(--accent-ink);font-weight:600}
.row{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ok)}
.g{margin:8px 0 0;font-size:14px}.g b{display:block;margin-bottom:4px}
.g span{display:inline-block;margin:2px 4px 2px 0;padding:1px 8px;border-radius:6px;background:var(--chip)}
.g span.m{background:var(--okbg);color:var(--ok);font-weight:600}
a.link{color:var(--ok);font-weight:600;font-size:14px}
.note{color:var(--mute);font-size:13px;margin-top:24px}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
<h1>Melyik képzésre jó az érettségid?</h1>
<p class="lead">Add meg legfeljebb három érettségi tárgyat, és megmutatjuk azokat a nappali képzéseket, ahová ezekkel jelentkezhetsz. Adatforrás: felvi.hu 2026-os meghirdetések.</p>
<div class="grid">
<aside class="panel side" aria-label="Szűrők">
<div id="slots"></div>
<fieldset><legend>Keresési mód</legend>
<label class="radio"><input type="radio" name="mode" value="rule" checked><span>Teljesíthető a szabály szerint<small>Csak az a képzés látszik, ahol a tárgyaidból kijön a kért kombináció.</small></span></label>
<label class="radio"><input type="radio" name="mode" value="any"><span>Csak szerepel az elfogadottak között<small>Elég, ha minden megadott tárgy valamelyik csoportban szerepel. Egyetlen tárgyhoz ezt válaszd.</small></span></label>
</fieldset>
<label class="f"><span>Képzés neve</span><input type="search" id="q" placeholder="pl. informatika, tanár"></label>
<label class="f"><span>Képzési terület</span><select id="area"></select></label>
<label class="f"><span>Intézmény</span><select id="inst"></select></label>
<div class="f"><button id="reset">Szűrők törlése</button></div>
</aside>
<main>
<div class="bar"><div class="count" id="count" aria-live="polite"></div></div>
<div id="hint" class="hint" hidden></div>
<div id="list"></div>
<div style="text-align:center"><button class="pri" id="more" hidden></button></div>
<p class="note" id="note"></p>
</main>
</div>
</div>

  if(c[4])h+=`<span class="chip">${esc(F[c[4]])}</span>`;
  h+=`</div><div class="row"><details data-c="1"><summary>Elfogadott tárgyak</summary><div class="g"><b>${esc(g2?"Egyet-egyet kell választani a két csoportból:":RULE[c[7]])}</b></div>`;
  h+=grp(g2?"1. csoport":"Tárgyak",g1,P)+(g2?grp("2. csoport",g2,P):"")+`</details><a class="link" href="${link}" target="_blank" rel="noopener">Megnyitás a felvi.hu-n</a></div></article>`;
  return h;
}
function more(){
  const end=Math.min(shown+STEP,res.length);
  $("list").insertAdjacentHTML("beforeend",res.slice(shown,end).map(card).join(""));
  shown=end;
  const r=res.length-shown;
  $("more").hidden=r<=0;$("more").textContent=`Még ${Math.min(STEP,r)} megjelenítése (${r} maradt)`;
}
function run(){
  P=picks();
  const mode=document.querySelector('input[name=mode]:checked').value;
  const q=$("q").value.trim().toLocaleLowerCase("hu"),ar=$("area").value,ins=$("inst").value;
  res=D.c.filter(c=>(ar===""||c[2]==ar)&&(ins===""||c[0]==ins)&&(!q||c[1].toLocaleLowerCase("hu").includes(q))&&ok(c,P,mode));
  $("list").innerHTML="";shown=0;
  $("count").innerHTML=`${res.length} <small>találat</small>`;
  const hint=$("hint");
  hint.hidden=!(mode==="rule"&&P.length===1);
  hint.textContent="Egy tárgyból a legtöbb képzésnél nem jön ki a kért kombináció. Adj meg még egy tárgyat, vagy válts a „Csak szerepel” módra.";
  if(!res.length){$("list").innerHTML='<div class="empty">Nincs találat. Próbálj másik tárgyat, vagy lazíts a szűrőkön.</div>'}
  more();
}
document.querySelectorAll("select,input").forEach(e=>e.addEventListener(e.type==="search"?"input":"change",run));
$("more").addEventListener("click",more);
$("reset").addEventListener("click",()=>{for(let n=1;n<=3;n++){$("s"+n).value="";$("e"+n).checked=false}$("q").value="";$("area").value="";$("inst").value="";document.querySelector('input[name=mode][value=rule]').checked=true;run()});
$("note").textContent=`A lista ${D.c.length} nappali képzést tartalmaz. ${D.x} további képzés (pl. gyakorlati vizsga alapú felvétel) nem ad érettségi pontot, ezért nem szerepel. Jelentkezés előtt mindig ellenőrizd a felvi.hu hivatalos tájékoztatóját.`;
run();
</script>
</body>
</html>
